name: Frontend CI/CD Pipeline

on:
  pull_request:
    branches:
      - development
      - staging
      - production
  push:
    branches:
      - staging
      - production

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    name: Lint, Typecheck & Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Type Check
        run: npx tsc --noEmit

      - name: Next.js Production Build
        run: npm run build
        env:
          NEXT_PUBLIC_APP_ENV: ${{ github.ref == 'refs/heads/production' && 'production' || 'staging' }}
          NEXT_PUBLIC_SITE_URL: ${{ github.ref == 'refs/heads/production' && 'https://careeros.ai' || 'https://staging.careeros.ai' }}
          NEXT_PUBLIC_API_URL: ${{ github.ref == 'refs/heads/production' && 'https://api.careeros.ai/api' || 'https://api-staging.careeros.ai/api' }}

  deploy-staging:
    name: Deploy to Staging Environment
    needs: validate-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.careeros.ai
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Staging Deployment Notification
        run: |
          echo "🚀 Automatically deploying staging build to Vercel/Hosting Provider..."
          echo "Target Environment: Staging (isolated from production)"

  deploy-production:
    name: Deploy to Production Environment
    needs: validate-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://careeros.ai
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # SAFETY GUARD: Production deployment requires manual sign-off
      - name: Production Deployment Gate
        run: |
          echo "🔒 Production deployment gate reached."
          echo "Release commit: ${{ github.sha }}"
          echo "Production deployment is currently in safe-standby mode until explicitly released by the repository owner."
